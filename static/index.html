<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DARK TRACE LOOM</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0a0e14;--bg2:#111820;--bg3:#1a2232;--brd:#1e2a3a;--t1:#e2e8f0;--t2:#8892a4;--tm:#4a5568;--ac:#00ff88;--am:#ffb800;--rd:#ff3355;--cy:#00d4ff;--pu:#a855f7}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--t1);font-size:13px;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--brd);height:48px}
.logo{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,var(--ac),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:9px;color:var(--tm);letter-spacing:2px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ac);display:inline-block;animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.nav{display:flex;gap:1px;background:var(--bg2);border-bottom:1px solid var(--brd);padding:0 16px}
.nav-i{padding:9px 16px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2);border-bottom:2px solid transparent;cursor:pointer}
.nav-i:hover{color:var(--t1)}.nav-i.on{color:var(--ac);border-color:var(--ac);background:#00ff8808}
.main{height:calc(100vh - 90px);overflow:auto;padding:14px}
.pnl{background:var(--bg2);border:1px solid var(--brd);border-radius:3px;overflow:hidden}
.pnl-h{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--brd);background:var(--bg3)}
.pnl-t{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.btn{padding:5px 12px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid var(--brd);background:transparent;color:var(--t2);font-family:inherit}
.btn:hover{border-color:var(--ac);color:var(--ac)}.btn-p{background:var(--ac);color:var(--bg);border:none}
.inp{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--brd);border-radius:3px;color:var(--t1);font-size:12px;font-family:inherit;outline:none}
.inp:focus{border-color:var(--ac)}
.bdg{display:inline-block;padding:1px 7px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.b-c{color:var(--rd);background:#ff335512;border:1px solid #ff335530}.b-h{color:var(--am);background:#ffb80012;border:1px solid #ffb80030}
.b-m{color:var(--cy);background:#00d4ff12;border:1px solid #00d4ff30}.b-l{color:var(--tm);background:#4a556812;border:1px solid #4a556830}
.b-a{color:var(--ac);background:#00ff8812;border:1px solid #00ff8830}
.row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--brd);cursor:pointer}.row:hover{background:var(--bg3)}
.stat-v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.stat-l{font-size:8px;color:var(--tm);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.rb{width:50px;height:3px;border-radius:2px;background:var(--brd);position:relative;display:inline-block;vertical-align:middle}
.rf{position:absolute;left:0;top:0;height:100%;border-radius:2px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--brd);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.json{font-size:10px;background:var(--bg);border:1px solid var(--brd);border-radius:3px;padding:10px;max-height:350px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--t2)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--tm)}
.grid-s{display:flex;justify-content:space-around;align-items:center;padding:14px;flex-wrap:wrap;gap:6px}
.divider{width:1px;height:36px;background:var(--brd)}
</style></head><body>
<header class="hdr"><div><div class="logo">DARK TRACE LOOM</div><div class="logo-sub">Enterprise OSINT Platform v2.0</div></div>
<div style="display:flex;align-items:center;gap:14px"><span class="pulse"></span><span style="font-size:9px;color:var(--ac);letter-spacing:1px">ACTIVE</span><span id="clock" style="font-size:11px;color:var(--t2)"></span></div></header>
<nav class="nav" id="nav"></nav>
<div class="main" id="pg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const TABS=['dashboard','investigate','graph','analytics','cases','alerts','settings'];
let tab='dashboard',selEnt=null;
const $=id=>document.getElementById(id);
function uc(){$('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false})}setInterval(uc,1000);uc();
// Nav
let navH='';TABS.forEach(t=>{navH+=`<div class="nav-i${t===tab?' on':''}" data-t="${t}">${t}</div>`});
$('nav').innerHTML=navH;$('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('on',n.dataset.t===t));render()};
// API
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});if(!r.ok)throw new Error(`${r.status}`);return r.json()}
function rc(s){return s>75?'var(--rd)':s>50?'var(--am)':'var(--ac)'}
function rb(s){return`<div style="display:flex;align-items:center;gap:6px"><div class="rb"><div class="rf" style="width:${s}%;background:${rc(s)}"></div></div><span style="font-size:10px;font-weight:700;color:${rc(s)}">${s}</span></div>`}
function sb(s){const m={critical:'b-c',high:'b-h',medium:'b-m',low:'b-l',active:'b-a'};return`<span class="bdg ${m[s]||'b-l'}">${s}</span>`}
function ei(t){return{person:'\u{1F464}',email:'\u2709',domain:'\u{1F310}',ip:'\u{1F4E1}',phone:'\u{1F4DE}',username:'\u{1F50D}',crypto:'\u26D3',organization:'\u{1F3E2}',social:'\u{1F4F1}'}[t]||'?'}
function ta(d){if(!d)return'';const s=Math.floor((Date.now()-new Date(d+'Z').getTime())/1000);return s<60?s+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'}
function tr(s,n=35){return s&&s.length>n?s.slice(0,n-2)+'..':s}
// Pages
async function render(){const el=$('pg');el.innerHTML='<div style="padding:40px;text-align:center"><div class="spin"></div></div>';
try{switch(tab){case'dashboard':await rDash(el);break;case'investigate':await rInv(el);break;case'graph':await rGraph(el);break;
case'analytics':await rAna(el);break;case'cases':await rCase(el);break;case'alerts':await rAlert(el);break;case'settings':await rSet(el);break}}
catch(e){el.innerHTML=`<div class="pnl" style="margin:20px;padding:20px;color:var(--rd)">Error: ${e.message}</div>`}}

async function rDash(el){
const[st,al,cs]=await Promise.all([api('/api/stats'),api('/api/alerts?limit=8'),api('/api/cases')]);
el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
<div class="pnl" style="grid-column:1/-1"><div class="grid-s">
${[['Entities',st.total_entities,'--cy'],['High Risk',st.high_risk_entities,'--rd'],['Alerts',st.unread_alerts,'--am'],['Cases',st.active_cases,'--ac'],['Relations',st.total_relationships,'--pu'],['Scans',st.total_scans,'--cy'],['API Keys',st.api_keys_configured,'--ac']].map(([l,v,c])=>`<div style="text-align:center"><div class="stat-v" style="color:var(${c})">${v}</div><div class="stat-l">${l}</div></div><div class="divider"></div>`).join('')}
</div></div>
<div class="pnl" style="grid-column:1/3"><div class="pnl-h"><span class="pnl-t">Alerts</span><div style="display:flex;align-items:center;gap:6px"><span class="pulse"></span><span style="font-size:9px;color:var(--ac)">LIVE</span></div></div>
${al.alerts.length?al.alerts.map(a=>`<div class="row">${sb(a.severity)}<span style="flex:1;font-size:11px">${a.message}</span><span style="font-size:9px;color:var(--tm)">${ta(a.created_at)}</span></div>`).join(''):'<div style="padding:16px;text-align:center;color:var(--tm)">No alerts. Run scans to generate.</div>'}
</div>
<div class="pnl"><div class="pnl-h"><span class="pnl-t">Actions</span></div><div style="padding:10px;display:flex;flex-direction:column;gap:6px">
${[['Investigate','investigate'],['Graph','graph'],['Analytics','analytics'],['Cases','cases'],['Settings','settings']].map(([l,t])=>`<button class="btn" onclick="tab='${t}';document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('on',n.dataset.t==='${t}'));render()" style="width:100%;text-align:left;padding:8px 12px">${l}</button>`).join('')}
</div></div>
<div class="pnl" style="grid-column:1/-1"><div class="pnl-h"><span class="pnl-t">Entity Breakdown</span></div>
<div style="padding:12px;display:flex;gap:12px;flex-wrap:wrap">
${Object.entries(st.entity_breakdown||{}).map(([t,c])=>`<div style="display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg);border:1px solid var(--brd);border-radius:3px"><span>${ei(t)}</span><span style="font-size:11px">${t}</span><span style="font-weight:700;color:var(--ac)">${c}</span></div>`).join('')||'<span style="color:var(--tm)">No entities yet</span>'}
</div></div></div>`}

async function rInv(el){
const{entities}=await api('/api/entities?limit=200');
el.innerHTML=`<div style="display:flex;height:calc(100vh - 122px)">
<div style="width:360px;border-right:1px solid var(--brd);display:flex;flex-direction:column">
<div style="padding:12px;border-bottom:1px solid var(--brd)"><div style="display:flex;gap:6px;margin-bottom:8px">
<input class="inp" id="si" placeholder="Email, domain, IP, phone, username, crypto..." style="flex:1">
<button class="btn btn-p" id="sb">SCAN</button><button class="btn" id="pb" style="color:var(--am);border-color:var(--am)">PIVOT</button></div>
<div id="td" style="font-size:9px;color:var(--tm)"></div></div>
<div id="sp" style="display:none"></div>
<div id="el" style="flex:1;overflow-y:auto">
${entities.length?entities.map(e=>`<div class="row" onclick="le('${e.id}')"><span style="font-size:14px">${ei(e.entity_type)}</span><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.value}</div><div style="font-size:9px;color:var(--tm)">${e.entity_type}</div></div>${rb(e.risk_score)}</div>`).join(''):'<div style="padding:30px;text-align:center;color:var(--tm)">No entities. Scan a target.</div>'}
</div></div>
<div style="flex:1;overflow:auto" id="ed"><div class="empty"><span style="font-size:40px;opacity:.2">\u{1F50D}</span><span style="font-size:11px;letter-spacing:2px">ENTER A TARGET AND SCAN</span></div></div></div>`;
const si=$('si'),sbn=$('sb');
si.oninput=async()=>{const q=si.value.trim();if(q.length>2){try{const{entity_type}=await api('/api/scan/detect?query='+encodeURIComponent(q));$('td').textContent='Detected: '+entity_type.toUpperCase();$('td').style.color='var(--ac)'}catch(e){}}else $('td').textContent=''};
sbn.onclick=()=>doScan();si.onkeydown=e=>{if(e.key==='Enter')doScan()};
$('pb').onclick=()=>{const v=si.value.trim();if(v)doPivot(v)};
async function doScan(){const q=si.value.trim();if(!q)return;sbn.disabled=true;sbn.textContent='...';$('sp').style.display='block';
$('sp').innerHTML='<div style="padding:16px;text-align:center"><div class="spin"></div><div style="margin-top:8px;font-size:10px;color:var(--ac);letter-spacing:2px">SCANNING...</div></div>';
try{const r=await api('/api/scan',{method:'POST',body:{query:q}});selEnt=r.entity_id;tab='investigate';render();setTimeout(()=>le(r.entity_id),300)}
catch(e){$('ed').innerHTML=`<div style="padding:16px;color:var(--rd)">${e.message}</div>`}finally{sbn.disabled=false;sbn.textContent='SCAN';$('sp').style.display='none'}}}

async function le(id){const ed=$('ed');if(!ed)return;ed.innerHTML='<div style="padding:30px;text-align:center"><div class="spin"></div></div>';
try{const{entity:e,scan_results:sr,relationships:rl}=await api('/api/entities/'+id);selEnt=id;
ed.innerHTML=`<div style="padding:16px;border-bottom:1px solid var(--brd)">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
<span style="font-size:24px">${ei(e.entity_type)}</span><div><div style="font-size:16px;font-weight:700">${e.value}</div>
<div style="font-size:10px;color:var(--tm)">${e.entity_type.toUpperCase()} | ${e.id}</div></div>
<div style="margin-left:auto"><div style="font-size:9px;color:var(--tm)">RISK</div>
<div style="font-size:28px;font-weight:800;color:${rc(e.risk_score)}">${e.risk_score}</div></div></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
${[['First Seen',(e.first_seen||'').split('T')[0]],['Last Seen',(e.last_seen||'').split('T')[0]],['Relations',rl.length],['Scans',sr.length]].map(([l,v])=>`<div style="padding:8px;background:var(--bg2);border:1px solid var(--brd);border-radius:3px"><div style="font-size:8px;color:var(--tm);letter-spacing:1px">${l}</div><div style="font-size:13px;font-weight:600;margin-top:2px">${v}</div></div>`).join('')}
</div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
<button class="btn btn-p" style="font-size:9px" onclick="aiAna('${e.id}')">AI ANALYZE</button>
<button class="btn" style="font-size:9px;color:var(--am);border-color:var(--am)" onclick="doPivot('${e.value.replace(/'/g,"\\'")}')">AUTO-PIVOT</button>
<button class="btn" style="font-size:9px" onclick="window.open('/api/export/stix','_blank')">STIX EXPORT</button>
</div></div>
<div style="padding:14px;overflow-y:auto;max-height:calc(100vh - 380px)">
${rl.length?`<div class="pnl" style="margin-bottom:10px"><div class="pnl-h"><span class="pnl-t">Connections (${rl.length})</span></div>
${rl.map(r=>{const o=r.other_entity;if(!o)return'';return`<div class="row" onclick="le('${o.id}')"><span style="font-size:14px">${ei(o.entity_type)}</span><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tr(o.value,45)}</div><div style="font-size:9px;color:var(--tm)">${o.entity_type}</div></div><span style="font-size:9px;color:var(--cy)">${r.rel_type}</span>${rb(o.risk_score)}</div>`}).join('')}</div>`:''}
${sr.length?`<div class="pnl"><div class="pnl-h"><span class="pnl-t">Scan Data (${sr.length})</span></div>
${sr.map(s=>`<div style="border-bottom:1px solid var(--brd)"><div style="padding:7px 12px;display:flex;justify-content:space-between;cursor:pointer;background:var(--bg3)" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
<span style="font-size:10px;font-weight:600;letter-spacing:1px">${s.source}</span><span style="font-size:9px;color:var(--tm)">${ta(s.scanned_at)}</span></div>
<div style="display:none;padding:8px 12px"><div class="json">${JSON.stringify(typeof s.data==='string'?JSON.parse(s.data):s.data,null,2)}</div></div></div>`).join('')}</div>`:''}
</div>`}catch(e){ed.innerHTML=`<div style="padding:16px;color:var(--rd)">${e.message}</div>`}}

async function rGraph(el){el.innerHTML='<div style="height:calc(100vh - 122px);position:relative"><div style="position:absolute;top:10px;left:10px;z-index:10;padding:8px 12px;background:var(--bg2);border:1px solid var(--brd);border-radius:3px" id="gs">Loading...</div><svg id="gsv" width="100%" height="100%" style="background:var(--bg)"></svg></div>';
const{nodes,links}=await api('/api/graph');$('gs').textContent=`NODES: ${nodes.length} | EDGES: ${links.length}`;
if(!nodes.length){el.innerHTML='<div class="empty" style="height:calc(100vh-122px)"><span style="font-size:40px;opacity:.2">\u{1F578}</span><span style="font-size:11px;letter-spacing:2px">NO DATA. RUN SCANS FIRST.</span></div>';return}
const svg=d3.select('#gsv'),w=svg.node().clientWidth,h=svg.node().clientHeight,g=svg.append('g');
svg.call(d3.zoom().scaleExtent([.2,5]).on('zoom',e=>g.attr('transform',e.transform)));
const cols={person:'#00d4ff',email:'#00ff88',domain:'#ffb800',ip:'#a855f7',phone:'#ff6b6b',username:'#4ecdc4',crypto:'#ffd93d',organization:'#6c5ce7',social:'#e056a0'};
const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(110).strength(.4)).force('charge',d3.forceManyBody().strength(-280)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide(28));
const link=g.append('g').selectAll('line').data(links).join('line').attr('stroke','#00ff8825').attr('stroke-width',d=>(d.confidence||.5)*2);
const lbl=g.append('g').selectAll('text').data(links).join('text').text(d=>d.rel_type).attr('font-size','7px').attr('fill','#4a5568').attr('text-anchor','middle').attr('font-family','inherit');
const node=g.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer')
.on('click',(ev,d)=>{tab='investigate';document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('on',n.dataset.t==='investigate'));render();setTimeout(()=>le(d.id),300)})
.call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
node.append('circle').attr('r',18).attr('fill',d=>(cols[d.entity_type]||'#00ff88')+'12');
node.append('circle').attr('r',12).attr('fill','#111820').attr('stroke',d=>cols[d.entity_type]||'#00ff88').attr('stroke-width',1.5);
node.append('text').text(d=>ei(d.entity_type)).attr('text-anchor','middle').attr('dominant-baseline','central').attr('font-size','10px');
node.append('text').text(d=>tr(d.label||d.value,16)).attr('y',22).attr('text-anchor','middle').attr('font-size','7px').attr('fill','#8892a4').attr('font-family','inherit');
node.append('circle').attr('r',3.5).attr('cx',9).attr('cy',-9).attr('fill',d=>d.risk_score>75?'#ff3355':d.risk_score>50?'#ffb800':'#00ff88').attr('stroke','#111820').attr('stroke-width',1);
sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
lbl.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);node.attr('transform',d=>`translate(${d.x},${d.y})`)})}

async function rAna(el){el.innerHTML='<div style="padding:30px;text-align:center"><div class="spin"></div><div style="margin-top:10px;font-size:9px;color:var(--tm)">Running PageRank, centrality, community detection, threat propagation...</div></div>';
const d=await api('/api/analytics');if(d.error){el.innerHTML=`<div style="padding:30px;text-align:center;color:var(--tm)">${d.error}. Run scans first.</div>`;return}
el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow-y:auto;max-height:calc(100vh - 122px)">
<div class="pnl" style="grid-column:1/-1"><div class="grid-s">
${[['Nodes',d.node_count,'--cy'],['Edges',d.edge_count,'--ac'],['Communities',d.community_count||0,'--pu'],['Bridges',d.bridge_count||0,'--am'],['Density',d.density?.toFixed(4)||0,'--ac'],['Components',d.components||0,'--cy']].map(([l,v,c])=>`<div style="text-align:center"><div class="stat-v" style="color:var(${c})">${v}</div><div class="stat-l">${l}</div></div><div class="divider"></div>`).join('')}
</div></div>
<div class="pnl"><div class="pnl-h"><span class="pnl-t">PageRank (Importance)</span></div><div style="max-height:280px;overflow-y:auto">
${(d.pagerank||[]).map((n,i)=>`<div class="row" onclick="tab='investigate';render();setTimeout(()=>le('${n.entity_id}'),300)"><span style="font-size:12px;font-weight:800;color:var(--ac);width:20px">#${i+1}</span><span>${ei(n.entity_type)}</span><div style="flex:1"><div style="font-size:10px;font-weight:600">${tr(n.value,28)}</div><div style="font-size:8px;color:var(--tm)">Score: ${n.score.toFixed(4)}</div></div>${rb(n.risk_score)}</div>`).join('')||'<div style="padding:14px;color:var(--tm)">No data</div>'}
</div></div>
<div class="pnl"><div class="pnl-h"><span class="pnl-t">Threat Propagation</span></div><div style="max-height:280px;overflow-y:auto">

<div class="pnl"><div class="pnl-h"><span class="pnl-t">Critical Bridges</span></div><div style="max-height:280px;overflow-y:auto">

async function rSet(el){const{keys}=await api('/api/keys');const cfgd=new Set(keys.map(k=>k.service));
const svcs=[{id:'anthropic',n:'Anthropic (Claude)',d:'AI engine. REQUIRED for AI features'},
{id:'shodan',n:'Shodan',d:'shodan.io'},{id:'virustotal',n:'VirusTotal',d:'virustotal.com'},
{id:'hibp',n:'HIBP',d:'haveibeenpwned.com/API/Key'},{id:'hunter',n:'Hunter.io',d:'hunter.io'},
{id:'securitytrails',n:'SecurityTrails',d:'securitytrails.com'},{id:'numverify',n:'NumVerify',d:'numverify.com'},
{id:'etherscan',n:'Etherscan',d:'etherscan.io'}];
el.innerHTML=`<div style="max-width:750px;margin:0 auto"><div style="font-size:9px;color:var(--tm);letter-spacing:2px;margin-bottom:14px">API KEY CONFIGURATION</div>
<div style="font-size:11px;color:var(--t2);margin-bottom:14px">Free sources (WHOIS, DNS, crt.sh, IP geo, Gravatar, GitHub, blockchain.info) work without keys.</div>
<div class="pnl">${svcs.map(s=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--brd)">
<div style="width:10px;height:10px;border-radius:50%;background:${cfgd.has(s.id)?'var(--ac)':'var(--brd)'}"></div>
<div style="flex:1"><div style="font-size:12px;font-weight:600">${s.n}</div><div style="font-size:9px;color:var(--tm)">${s.d}</div></div>
<input class="inp" id="k-${s.id}" placeholder="${cfgd.has(s.id)?'Configured':'API key...'}" style="width:240px;font-size:10px">
<button class="btn" style="font-size:9px" onclick="saveK('${s.id}')">SAVE</button>
${cfgd.has(s.id)?`<button class="btn" style="font-size:9px;color:var(--rd);border-color:var(--rd)" onclick="delK('${s.id}')">DEL</button>`:''}</div>`).join('')}
</div></div>`}
async function saveK(s){const v=document.getElementById('k-'+s)?.value?.trim();if(!v)return;await api('/api/keys',{method:'POST',body:{service:s,api_key:v}});render()}
async function delK(s){await api('/api/keys/'+s,{method:'DELETE'});render()}

async function doPivot(v){const d=prompt('Pivot depth (1-5):','2');if(!d)return;const m=prompt('Max entities:','100');if(!m)return;
const el=$('ed')||$('pg');el.innerHTML='<div style="padding:30px;text-align:center"><div class="spin"></div><div style="margin-top:10px;font-size:9px;color:var(--am)">AUTO-PIVOT RUNNING...</div></div>';
try{const r=await api('/api/autopivot',{method:'POST',body:{seed:v,max_depth:parseInt(d),max_entities:parseInt(m)}});
el.innerHTML=`<div style="padding:16px"><div class="pnl"><div class="pnl-h"><span class="pnl-t">Auto-Pivot Complete</span></div><div style="padding:14px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
${[['Scans',r.total_scans],['Entities',r.total_entities],['Depth',r.max_depth_reached],['Errors',r.errors]].map(([l,v])=>`<div style="padding:8px;background:var(--bg);border:1px solid var(--brd);border-radius:3px"><div style="font-size:8px;color:var(--tm);letter-spacing:1px">${l}</div><div style="font-size:14px;font-weight:700;margin-top:2px">${v}</div></div>`).join('')}
</div><div style="display:flex;gap:6px"><button class="btn btn-p" onclick="tab='graph';document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('on',n.dataset.t==='graph'));render()">VIEW GRAPH</button>
<button class="btn" onclick="tab='analytics';document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('on',n.dataset.t==='analytics'));render()">ANALYTICS</button></div></div></div></div>`}catch(e){el.innerHTML=`<div style="padding:16px;color:var(--rd)">${e.message}</div>`}}

async function aiAna(id){const ed=$('ed');if(!ed)return;ed.innerHTML='<div style="padding:30px;text-align:center"><div class="spin"></div><div style="margin-top:10px;font-size:9px;color:var(--pu)">AI ANALYZING...</div></div>';
try{const r=await api('/api/ai/analyze/'+id,{method:'POST'});
if(r.success)ed.innerHTML=`<div style="padding:14px;overflow-y:auto;max-height:calc(100vh-200px)"><div class="pnl"><div class="pnl-h"><span class="pnl-t">AI Assessment</span></div><div style="padding:14px;font-size:11px;line-height:1.8;color:var(--t2);white-space:pre-wrap">${r.result}</div></div><button class="btn" onclick="le('${id}')" style="margin-top:10px">BACK</button></div>`;
else ed.innerHTML=`<div style="padding:16px;color:var(--rd)">${r.error||'Failed'}. Configure Anthropic key in Settings.</div>`}catch(e){ed.innerHTML=`<div style="padding:16px;color:var(--rd)">${e.message}. Configure Anthropic key in Settings.</div>`}}

async function aiCorr(){const el=$('pg');el.innerHTML='<div style="padding:30px;text-align:center"><div class="spin"></div><div style="margin-top:10px;font-size:9px;color:var(--pu)">AI CORRELATING NETWORK...</div></div>';
try{const r=await api('/api/ai/correlate',{method:'POST'});
if(r.success)el.innerHTML=`<div style="padding:14px;overflow-y:auto;max-height:calc(100vh-122px)"><div class="pnl"><div class="pnl-h"><span class="pnl-t">AI Network Correlation</span></div><div class="json" style="max-height:none;margin:14px">${r.result}</div></div><button class="btn" onclick="tab='analytics';render()" style="margin-top:10px">BACK</button></div>`;
else{alert('Error: '+(r.error||'')+'. Configure Anthropic key.');tab='analytics';render()}}catch(e){alert(e.message);tab='analytics';render()}}

render();
